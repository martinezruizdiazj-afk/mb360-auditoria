name: Apply active client banner

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-active-client-banner.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply active client safety UI
        run: python scripts/apply-active-client-banner.py
      - name: Remove temporary patch files
        run: |
          rm -f scripts/apply-active-client-banner.py
          rm -f .github/workflows/apply-active-client-banner.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Show active client across MB360 tools'
          git push
