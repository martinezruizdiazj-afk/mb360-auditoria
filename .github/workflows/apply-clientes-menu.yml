name: Apply Clientes menu

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-clientes-menu.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Clientes template to main menu
        run: python scripts/apply-clientes-menu.py
      - name: Remove temporary patch files
        run: |
          rm -f scripts/apply-clientes-menu.py
          rm -f .github/workflows/apply-clientes-menu.yml
      - name: Commit Clientes template
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Add Clientes template to MB360 main menu'
          git push
