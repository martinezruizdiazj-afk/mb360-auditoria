name: MB360 one-time Research disposition fix
on:
  push:
    paths:
      - '.github/workflows/mb360-research-disposition-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Research disposition values
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research-v2.js')
          s=p.read_text()
          reps=[("rsv2SetDisposition('${f.id}','immediate')","rsv2SetDisposition('${f.id}','resolve_now')"),("rsv2SetDisposition('${f.id}','watch')","rsv2SetDisposition('${f.id}','monitor')")]
          for old,new in reps:
            n=s.count(old)
            if n!=1: raise SystemExit(f'expected one match, got {n}: {old}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-v2.js
          git commit -m "Align Research dispositions with database constraints"
          git push
