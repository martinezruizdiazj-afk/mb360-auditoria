name: One-time Research OAuth UI loader
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load Research OAuth module
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          needle='  <script src="research-v2.js?v=research2-1"></script>'
          add=needle+'\n  <script src="research-oauth-v2.js?v=research-oauth-1"></script>'
          if 'research-oauth-v2.js' not in s:
              if needle not in s:
                  raise SystemExit('research-v2 loader not found')
              p.write_text(s.replace(needle,add,1))
          PY
      - name: Commit loader
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load Research private OAuth controls"
          git push
