name: MB360 one-time Research Google private UI wiring
on:
  push:
    paths:
      - '.github/workflows/mb360-research-context-ui-v2.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Google private resources
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          needle='  <script src="research-oauth-v2.js?v=research-oauth-1"></script>'
          add=needle+'\n  <script src="research-google-v2.js?v=research-google-1"></script>'
          if 'research-google-v2.js' not in s:
              if needle not in s: raise SystemExit('oauth loader not found')
              s=s.replace(needle,add,1)
              p.write_text(s)

          p=Path('research-v2.js')
          s=p.read_text()
          needle='window.renderResearch=renderResearch;window.rsv2Tab='
          add='window.renderResearch=renderResearch;window.rsv2CurrentRunId=()=>RS.run?.id||null;window.rsv2Tab='
          if 'rsv2CurrentRunId' not in s:
              if needle not in s: raise SystemExit('Research export anchor not found')
              s=s.replace(needle,add,1)
              p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html research-v2.js
          git commit -m "Wire Google private resources into Research"
          git push
