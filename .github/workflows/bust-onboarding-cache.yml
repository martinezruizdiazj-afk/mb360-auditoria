name: Refresh onboarding module cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bust-onboarding-cache.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update onboarding cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script src="inicio-cliente-app.js?v=native1"></script>'
          new='<script src="inicio-cliente-app.js?v=dedup20"></script>'
          if old not in s:
              raise SystemExit('Expected onboarding script tag not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Remove helper and commit
        run: |
          rm -f .github/workflows/bust-onboarding-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh onboarding module after approved dedup changes'
          git push
