name: Apply production v2
on:
  push:
    paths:
      - '.github/production-v2-trigger.txt'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and install Produccion v2
        shell: bash
        run: |
          set -euo pipefail
          cat .github/production-v2-parts/part-* > produccion-v2.js
          node --check produccion-v2.js
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='  <link rel="stylesheet" href="produccion-v2.css?v=prod2-1">\n'
          js='  <script src="produccion-v2.js?v=prod2-1"></script>\n'
          if 'produccion-v2.css' not in s:
              if '</head>' not in s: raise SystemExit('Missing </head>')
              s=s.replace('</head>', css+'</head>', 1)
          if 'produccion-v2.js' not in s:
              if '</body>' not in s: raise SystemExit('Missing </body>')
              s=s.replace('</body>', js+'</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'produccion-v2.css' index.html
          grep -q 'produccion-v2.js' index.html
          rm -rf .github/production-v2-parts
          rm -f .github/production-v2-trigger.txt
          rm -f .github/workflows/apply-production-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement complete Production module v2'
          git push
