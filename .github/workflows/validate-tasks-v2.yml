name: Validate Tasks v2
on:
  workflow_dispatch:
  push:
    paths:
      - '.task-v2-validate'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check tareas-v2.js
      - name: Cleanup validator
        run: |
          git config user.name "mb360-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .task-v2-validate
          git rm -f .github/workflows/validate-tasks-v2.yml
          git commit -m "Validate Tasks v2 syntax"
          git push
