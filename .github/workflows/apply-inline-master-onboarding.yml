name: Apply inline master onboarding

on:
  push:
    branches: [main]
    paths:
      - 'scripts/inline-master-onboarding.py'
      - '.github/workflows/apply-inline-master-onboarding.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/inline-master-onboarding.py
      - name: Commit patched center
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Integrate master onboarding inside operations center'
          git push
