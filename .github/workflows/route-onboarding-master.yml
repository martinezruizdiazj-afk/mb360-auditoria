name: Route onboarding to master

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Route onboarding to master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch onboarding route
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          needle = "function openTool(id,quiet=false){\n"
          insert = "function openTool(id,quiet=false){\n  if(id==='onboarding'){ window.location.href='./inicio-cliente-maestro.html'; return; }\n"
          if insert not in s:
              if needle not in s:
                  raise SystemExit('openTool function not found')
              s = s.replace(needle, insert, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit route fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Route onboarding to master"
          git push
