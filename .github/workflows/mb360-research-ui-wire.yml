name: MB360 one-time Research UI wiring
on:
  push:
    paths:
      - '.github/workflows/mb360-research-ui-wire.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Research v2
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          reps=[
            ('  <link rel="stylesheet" href="reportes-v2.css?v=rep2-1">','  <link rel="stylesheet" href="reportes-v2.css?v=rep2-1">\n  <link rel="stylesheet" href="research-v2.css?v=research2-1">'),
            ('          <button class="mini-btn" onclick="openClientWorkspace(\'${c.id}\',\'onboarding\')">Inicio de cliente</button>\n          <button class="mini-btn" onclick="openClientWorkspace(\'${c.id}\',\'production\')">Producción</button>','          <button class="mini-btn" onclick="openClientWorkspace(\'${c.id}\',\'onboarding\')">Inicio de cliente</button>\n          <button class="mini-btn" onclick="openClientWorkspace(\'${c.id}\',\'research\')">Investigación</button>\n          <button class="mini-btn" onclick="openClientWorkspace(\'${c.id}\',\'production\')">Producción</button>'),
            ('      <button class="mini-btn" onclick="openClientWorkspace(\'${c.id}\',\'onboarding\')">🤝 Inicio de cliente</button>\n      <button class="mini-btn" onclick="openClientWorkspace(\'${c.id}\',\'production\')">🎬 Producción</button>','      <button class="mini-btn" onclick="openClientWorkspace(\'${c.id}\',\'onboarding\')">🤝 Inicio de cliente</button>\n      <button class="mini-btn" onclick="openClientWorkspace(\'${c.id}\',\'research\')">🧭 Investigación</button>\n      <button class="mini-btn" onclick="openClientWorkspace(\'${c.id}\',\'production\')">🎬 Producción</button>'),
            ('      <button class="tool-card" onclick="openTool(\'production\')"><div class="tool-icon">🎬</div><h2>Producción de contenido</h2>','      <button class="tool-card" onclick="openTool(\'research\')"><div class="tool-icon">🧭</div><h2>Investigación</h2><p>Convierte evidencia, competencia, demanda y contexto en prioridades accionables.</p><span class="tool-link">Abrir investigación →</span></button>\n      <button class="tool-card" onclick="openTool(\'production\')"><div class="tool-icon">🎬</div><h2>Producción de contenido</h2>'),
            ('  <script src="reportes-v2.js?v=rep2-1"></script>','  <script src="reportes-v2.js?v=rep2-1"></script>\n  <script src="research-v2.js?v=research2-1"></script>')
          ]
          for old,new in reps:
            n=s.count(old)
            if n!=1:
              raise SystemExit(f'expected exactly one match, got {n}: {old[:90]}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire Research v2 into MB360 workspace"
          git push
