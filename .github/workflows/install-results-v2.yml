name: Install Results v2
on:
  push:
    paths:
      - 'trigger-results-v2.txt'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index
        run: python scripts/install-results-v2.py
      - name: Validate JavaScript syntax
        run: node --check resultados-v2.js
      - name: Commit installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install complete Results v2 module" || exit 0
          git push
