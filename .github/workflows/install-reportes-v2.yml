name: Install Reportes v2
on:
  push:
    paths:
      - 'scripts/install-reportes-v2.py'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Reportes v2 JavaScript
        run: node --check reportes-v2.js
      - name: Patch index
        run: python scripts/install-reportes-v2.py
      - name: Verify install
        run: |
          grep -q 'reportes-v2.css?v=rep2-1' index.html
          grep -q 'reportes-v2.js?v=rep2-1' index.html
      - name: Commit installation and remove installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/install-reportes-v2.py .github/workflows/install-reportes-v2.yml
          git add index.html scripts/install-reportes-v2.py .github/workflows/install-reportes-v2.yml
          git commit -m 'Install Reportes v2 module' || exit 0
          git push
