name: Apply Claude onboarding fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-claude-upload.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write reviewed Claude files
        run: python scripts/apply-claude-upload.py
      - name: Commit fixed onboarding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html inicio-cliente-app.js inicio-cliente.css inicio-cliente.html inicio-cliente-maestro.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Apply Claude native onboarding fix'
          git push
