name: Apply active client audit navigation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-active-audit-nav.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch audit navigation
        run: python scripts/apply-active-audit-nav.py
      - name: Remove temporary patch files
        run: |
          rm -f scripts/apply-active-audit-nav.py
          rm -f .github/workflows/apply-active-audit-nav.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Open selected client audit from main navigation'
          git push
