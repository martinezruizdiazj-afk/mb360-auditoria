name: MB360 one-time Research task bridge wiring
on:
  push:
    paths:
      - '.github/workflows/mb360-research-task-bridge.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Research findings to Tasks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research-v2.js')
          s=p.read_text()
          old1="<button class=\"rsv2-action\" onclick=\"rsv2EditFinding('${f.id}')\">Editar</button><button class=\"rsv2-action ok\" onclick=\"rsv2SetDisposition('${f.id}','plan_90d')\">Plan 90 días</button>"
          new1="<button class=\"rsv2-action\" onclick=\"rsv2EditFinding('${f.id}')\">Editar</button><button class=\"rsv2-action primary\" onclick=\"rsv2CreateTask('${f.id}')\">Crear tarea</button><button class=\"rsv2-action ok\" onclick=\"rsv2SetDisposition('${f.id}','plan_90d')\">Plan 90 días</button>"
          if s.count(old1)!=1: raise SystemExit(f'action target count {s.count(old1)}')
          s=s.replace(old1,new1,1)
          old2="  async function setDisposition(id,value){"
          new2="""  async function createTask(id){try{const{data,error}=await sb.rpc('mb360_create_task_from_research_finding',{p_finding_id:id});if(error)throw error;toast('Tarea creada desde Investigación ✓');await loadResearch(RS.run.id);renderResearch(document.getElementById('main'));return data;}catch(e){console.error(e);toast('Error: '+(e.message||'no se pudo crear la tarea'));}}\n  async function setDisposition(id,value){"""
          if s.count(old2)!=1: raise SystemExit(f'function target count {s.count(old2)}')
          s=s.replace(old2,new2,1)
          old3="window.rsv2SaveFinding=saveFinding;window.rsv2SetDisposition=setDisposition;"
          new3="window.rsv2SaveFinding=saveFinding;window.rsv2CreateTask=createTask;window.rsv2SetDisposition=setDisposition;"
          if s.count(old3)!=1: raise SystemExit(f'global target count {s.count(old3)}')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-v2.js
          git commit -m "Connect Research findings to Tasks"
          git push
