name: MB360 one-time Research external refresh UI
on:
  push:
    paths:
      - '.github/workflows/mb360-research-refresh-ui.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire external refresh controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research-v2.js')
          s=p.read_text()
          old1="function sourcesView(){return `${runHeader()}<div class=\"card\"><div class=\"rsv2-panel-head\"><div><div class=\"section-title\">Fuentes</div><div class=\"hint\" style=\"margin:0\">Internas, externas y manuales. Cada fuente conserva fecha y vigencia.</div></div>${canEdit()?'<button class=\"btn primary\" style=\"flex:0 0 auto;min-height:42px;padding:10px 14px\" onclick=\"rsv2OpenSource()\">+ Fuente</button>':''}</div>"
          new1="function sourcesView(){return `${runHeader()}<div class=\"card\"><div class=\"rsv2-panel-head\"><div><div class=\"section-title\">Fuentes</div><div class=\"hint\" style=\"margin:0\">Internas, externas y manuales. Cada fuente conserva fecha y vigencia.</div></div>${canEdit()?'<div class=\"rsv2-actions\"><button class=\"rsv2-action\" onclick=\"rsv2RefreshAllExternal()\">Actualizar externas</button><button class=\"btn primary\" style=\"flex:0 0 auto;min-height:42px;padding:10px 14px\" onclick=\"rsv2OpenSource()\">+ Fuente</button></div>':''}</div>"
          if s.count(old1)!=1: raise SystemExit(f'sourcesView target count {s.count(old1)}')
          s=s.replace(old1,new1,1)
          old2="function sourceCard(s){const fr=freshness(s.valid_until,s.freshness_status);return `<div class=\"rsv2-item\"><div class=\"rsv2-item-top\"><div><h3>${escR(s.source_name)}</h3><div class=\"rsv2-meta\">${escR(s.source_type)}${s.source_category?' · '+escR(s.source_category):''} · consultado ${fmtRDate(s.retrieved_at)}</div></div><span class=\"rsv2-badge ${fr==='outdated'?'stale':fr==='needs_refresh'?'refresh':'current'}\">${freshLabel(fr)}</span></div>${s.source_url?`<div class=\"rsv2-source-link\">${escR(s.source_url)}</div>`:''}${s.valid_until?`<div class=\"rsv2-meta\">Válido hasta ${fmtRDate(s.valid_until)}</div>`:''}</div>`;}"
          new2="function sourceCard(s){const fr=freshness(s.valid_until,s.freshness_status),m=s.metadata||{};return `<div class=\"rsv2-item\"><div class=\"rsv2-item-top\"><div><h3>${escR(s.source_name)}</h3><div class=\"rsv2-meta\">${escR(s.source_type)}${s.source_category?' · '+escR(s.source_category):''} · consultado ${fmtRDate(s.retrieved_at)}</div></div><span class=\"rsv2-badge ${fr==='outdated'?'stale':fr==='needs_refresh'?'refresh':'current'}\">${freshLabel(fr)}</span></div>${s.source_url?`<div class=\"rsv2-source-link\">${escR(s.source_url)}</div>`:''}${m.last_title?`<div class=\"rsv2-copy\"><b>Última lectura:</b> ${escR(m.last_title)}</div>`:''}${m.last_refresh_changed?'<div class=\"rsv2-note\">⚠️ El contenido cambió desde la lectura anterior. Revisa los hallazgos relacionados.</div>':''}${s.valid_until?`<div class=\"rsv2-meta\">Válido hasta ${fmtRDate(s.valid_until)}</div>`:''}${canEdit()&&s.source_type==='external'&&s.source_url?`<div class=\"rsv2-actions\"><button class=\"rsv2-action primary\" onclick=\"rsv2RefreshSource('${s.id}')\">Actualizar fuente</button></div>`:''}</div>`;}"
          if s.count(old2)!=1: raise SystemExit(f'sourceCard target count {s.count(old2)}')
          s=s.replace(old2,new2,1)
          old3="  async function saveSource(){"
          new3="""  async function refreshSource(id,silent=false){try{const{data,error}=await sb.functions.invoke('mb360-research-refresh-source',{body:{source_id:id}});if(error)throw error;if(data?.error)throw new Error(data.error);await loadResearch(RS.run.id);if(!silent)toast(data?.changed?'Fuente actualizada · detecté cambios ✓':'Fuente actualizada ✓');renderResearch(document.getElementById('main'));return data;}catch(e){console.error(e);if(!silent)toast('Error: '+(e.message||'no se pudo actualizar la fuente'));throw e;}}\n  async function refreshAllExternal(){const rows=RS.sources.filter(x=>x.source_type==='external'&&x.source_url);if(!rows.length)return toast('No hay fuentes externas con URL.');let ok=0,fail=0,changed=0;for(const s of rows){try{const r=await refreshSource(s.id,true);ok++;if(r?.changed)changed++;}catch{fail++;}}await loadResearch(RS.run.id);toast(`${ok} actualizada(s)${changed?` · ${changed} con cambios`:''}${fail?` · ${fail} error(es)`:''}`);renderResearch(document.getElementById('main'));}\n  async function saveSource(){"""
          if s.count(old3)!=1: raise SystemExit(f'saveSource target count {s.count(old3)}')
          s=s.replace(old3,new3,1)
          old4="window.rsv2CreateRun=createRun;window.rsv2OpenSource=openSource;window.rsv2SaveSource=saveSource;"
          new4="window.rsv2CreateRun=createRun;window.rsv2OpenSource=openSource;window.rsv2RefreshSource=refreshSource;window.rsv2RefreshAllExternal=refreshAllExternal;window.rsv2SaveSource=saveSource;"
          if s.count(old4)!=1: raise SystemExit(f'global target count {s.count(old4)}')
          s=s.replace(old4,new4,1)
          p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-v2.js
          git commit -m "Add external source refresh controls to Research"
          git push
