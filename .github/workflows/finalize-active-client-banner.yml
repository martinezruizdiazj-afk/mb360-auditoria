name: Finalize active client banner

on:
  push:
    branches: [main]
    paths:
      - 'scripts/finalize-active-client-banner.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/finalize-active-client-banner.py
      - run: |
          rm -f scripts/finalize-active-client-banner.py
          rm -f .github/workflows/finalize-active-client-banner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Keep active client visible after onboarding restore'
          git push
