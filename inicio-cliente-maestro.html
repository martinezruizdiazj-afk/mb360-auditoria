<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MB360 · Inicio de Cliente Maestro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="inicio-cliente.css?v=maestro3">
</head>
<body>
<div class="wrap">
  <div id="login" class="login">
    <div class="card" style="width:100%">
      <div class="logo">MB<span>360</span></div>
      <h2>Inicio de Cliente · Maestro</h2>
      <p style="color:var(--m)">Versión Maestra MB360</p>
      <div id="loginSt" class="status">Comprobando sesión…</div>
    </div>
  </div>

  <div id="app" class="hidden">
    <div class="top">
      <div class="brand">
        <div><div class="k">MARKETBOOST360 · MAESTRO</div><h1>Inicio de Cliente</h1></div>
        <button id="logout" class="btn sec small">Salir</button>
      </div>
      <div class="prog"><i id="bar"></i></div>
      <div id="pt" class="mini"></div>
    </div>

    <div class="picker">
      <label class="ttl">Vincular con cliente/prospecto existente</label>
      <select id="client"><option value="">— Nuevo cliente —</option></select>
      <div class="help">Auditoría e Inicio de Cliente quedan vinculados a la misma ficha central.</div>
    </div>

    <form id="form"></form>

    <div id="review" class="card hidden">
      <div class="head"><div class="num">✓</div><div><h2>Revisión final</h2><p>Comprueba lo esencial antes de guardar.</p></div></div>
      <div id="sum" class="summary"></div>
      <div class="row" style="margin-top:12px">
        <button type="button" id="draft" class="btn sec">Guardar borrador</button>
        <button type="button" id="final" class="btn pri">Finalizar Inicio de Cliente</button>
      </div>
      <div id="saveSt" class="status"></div>
    </div>
  </div>
</div>

<div id="nav" class="nav hidden">
  <div class="navin">
    <button id="prev" class="btn sec">← Anterior</button>
    <button id="next" class="btn pri">Siguiente →</button>
  </div>
</div>

<script src="inicio-cliente-config.js?v=maestro3"></script>
<script src="inicio-cliente-app.js?v=maestro3"></script>
</body>
</html>
