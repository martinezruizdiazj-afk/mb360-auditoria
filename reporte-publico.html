<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte MB360</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--ink:#0C1524;--muted:#5B6472;--line:#E3E7EC;--bg:#F2F4F7;--primary:#0B48D0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.wrap{max-width:900px;margin:0 auto;padding:22px}.shell{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.cover{background:var(--ink);color:#fff;padding:34px}.cover.white{background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}.brand{font:800 14px Archivo,sans-serif;letter-spacing:.08em}.cover h1{font:800 34px Archivo,sans-serif;margin:28px 0 9px}.cover p{margin:0;color:#CAD2DF}.cover.white p{color:var(--muted)}.body{padding:28px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:28px}.kpi{background:#F7F9FC;border:1px solid var(--line);border-radius:12px;padding:12px}.kpi span{display:block;color:var(--muted);font-size:11px}.kpi b{display:block;font:800 20px Archivo,sans-serif;margin:4px 0}.kpi small.up{color:#147A50}.kpi small.down{color:#D93036}section{padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--line)}section:last-child{border:0}section h2{font:800 20px Archivo,sans-serif;margin:0 0 9px}section p{white-space:pre-wrap;line-height:1.65;margin:0}.evidence{display:grid;gap:8px}.evidence a{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:10px;color:var(--primary);text-decoration:none;font-weight:700}.topbar{display:flex;justify-content:flex-end;margin-bottom:10px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.gate{max-width:430px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}.gate h1{font:800 24px Archivo,sans-serif}.gate input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;margin:10px 0}.gate button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-weight:800}.msg{font-size:13px;color:var(--muted);margin-top:10px}.hidden{display:none}@media(max-width:700px){.wrap{padding:10px}.cover{padding:24px}.cover h1{font-size:27px}.body{padding:18px}.kpis{grid-template-columns:1fr 1fr}}@media print{body{background:#fff}.wrap{max-width:none;padding:0}.topbar{display:none}.shell{border:0;border-radius:0}.cover{-webkit-print-color-adjust:exact;print-color-adjust:exact}section{break-inside:avoid}}</style></head><body><div id="gate" class="gate"><h1>Reporte privado</h1><p class="msg" id="gateMsg">Verificando enlace…</p><div id="pinBox" class="hidden"><input id="pin" inputmode="numeric" placeholder="PIN"><button onclick="loadReport()">Abrir reporte</button></div></div><div id="app" class="wrap hidden"><div class="topbar"><button class="btn" onclick="window.print()">PDF / Imprimir</button></div><div id="report"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script><script>const sb=window.supabase.createClient('https://fztdnelzhdoewxqpkxja.supabase.co','sb_publishable_HDXDi8L0Li9riuogd0YfVQ_AEHOCA-D',{auth:{persistSession:false}});const token=new URLSearchParams(location.search).get('t')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=v=>Number(v||0).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});const val=k=>k.unit==='money'?money(k.value):Number(k.value||0).toLocaleString('en-US',{maximumFractionDigits:1});const pct=v=>v==null?'—':`${v>=0?'+':''}${Number(v).toFixed(1)}%`;async function loadReport(){document.getElementById('gateMsg').textContent='Cargando…';const pin=document.getElementById('pin')?.value||null;const {data,error}=await sb.rpc('report_public_get',{p_token:token,p_pin:pin});if(error){document.getElementById('gateMsg').textContent='No se pudo abrir el reporte.';return}if(!data?.ok){if(data?.error==='pin_required'||data?.error==='pin_invalid'){document.getElementById('pinBox').classList.remove('hidden');document.getElementById('gateMsg').textContent=data.error==='pin_invalid'?'PIN incorrecto.':'Este reporte requiere PIN.';return}document.getElementById('gateMsg').textContent=data?.error==='expired'?'Este enlace venció.':'Este enlace no está disponible.';return}render(data)}function render(x){const d=x.report||{},m=x.meta||{},brand=d.branding_mode==='white_label'?'':d.branding_mode==='client'?(m.client_name||''):'MARKETBOOST360';const k=(d.kpis||[]).filter(z=>z.value!=null);document.getElementById('report').innerHTML=`<div class="shell"><div class="cover ${d.branding_mode==='white_label'?'white':''}"><div class="brand">${esc(brand)}</div><h1>${esc(d.title||m.title||'Reporte')}</h1><p>${esc(m.client_name||'')} · ${esc(m.period_start||'')} – ${esc(m.period_end||'')}${m.location?' · '+esc(m.location):''}</p></div><div class="body">${k.length?`<div class="kpis">${k.slice(0,8).map(z=>`<div class="kpi"><span>${esc(z.label)}</span><b>${esc(val(z))}</b><small class="${z.change>1?'up':z.change<-1?'down':''}">${esc(pct(z.change))}</small></div>`).join('')}</div>`:''}${(d.sections||[]).map(s=>`<section><h2>${esc(s.title)}</h2><p>${esc(s.body)}</p></section>`).join('')}${(d.evidence||[]).length?`<section><h2>${d.language==='en'?'Evidence':'Evidencias'}</h2><div class="evidence">${d.evidence.map(e=>e.public_url?`<a href="${esc(e.public_url)}" target="_blank" rel="noopener">${esc(e.title)}</a>`:`<div>${esc(e.title)}</div>`).join('')}</div></section>`:''}</div></div>`;document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.title=d.title||m.title||'Reporte'}loadReport();</script></body></html>
